services:
  - type: web
    name: moneymate-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn moneymate.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ML_BASE_URL
        value: "https://ml-reposit.onrender.com"
      # Set this in the Render dashboard to your Supabase connection string
      - key: DATABASE_URL
        sync: false
